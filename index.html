<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110e"><meta name="description" content="JYLAN.OI — неоновая змейка"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>JYLAN.OI — Neon Snake</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#050c0a;color:#eafff3}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#103d2c 0%,#07120e 48%,#040806 100%);display:flex;justify-content:center;padding:22px 12px 35px}.app{width:min(100%,560px)}header{text-align:center;margin-bottom:18px}h1{margin:0;color:#baffd0;letter-spacing:.13em;font-size:clamp(30px,7vw,46px);text-shadow:0 0 26px #32ff88}header p{margin:5px 0;color:#7fbb9b;letter-spacing:.22em;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat{border:1px solid #24503b;background:#0c2018;border-radius:13px;padding:10px;text-align:center}.stat small{display:block;color:#85b59a;font-size:10px;letter-spacing:.12em}.stat strong{display:block;color:#c5ffda;font-size:25px;margin-top:3px}.board{position:relative;border:2px solid #2a9b59;border-radius:17px;overflow:hidden;box-shadow:0 0 35px #00ff7130,inset 0 0 20px #00ff7112;background:#07120e;touch-action:none}canvas{display:block;width:100%;aspect-ratio:1/1}.overlay{position:absolute;inset:0;background:#03100bd9;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:12px}.overlay.hidden{display:none}.overlay h2{font-size:30px;margin:0;color:#b6ffd1;text-shadow:0 0 20px #18ff74}.overlay p{color:#9ac5aa;margin:0;line-height:1.5}.btn{cursor:pointer;border:1px solid #38e17c;border-radius:12px;background:#19c866;color:#042010;padding:13px 24px;font-weight:800;font-size:15px;box-shadow:0 0 18px #1ee67655}.btn.secondary{background:#10251a;color:#adffcd;box-shadow:none}.actions{display:flex;gap:9px;margin-top:13px}.actions button{flex:1}.controls{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center;margin-top:19px}.control{border:1px solid #287b4b;background:#123321;color:#baffd0;border-radius:12px;font-size:24px;touch-action:manipulation;user-select:none}.control:active{background:#26b961}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.hint{text-align:center;color:#7ca58a;font-size:12px;margin-top:14px;line-height:1.6}footer{text-align:center;color:#4e8062;font-size:11px;margin-top:20px;letter-spacing:.1em}@media(min-width:700px){.controls{display:none}}@media(max-width:600px){body{padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}header{margin-bottom:10px}h1{font-size:31px}header p{font-size:9px}.stat{padding:7px}.stat strong{font-size:21px}.stats{margin-bottom:9px}.board{border-radius:13px}.actions{margin-top:9px}.controls{margin-top:12px;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,47px)}.hint{margin-top:9px;font-size:11px}footer{margin-top:10px}}
</style></head><body><main class="app"><header><h1>JYLAN.OI</h1><p>MOBILE EDITION · V2.0</p></header><section class="stats"><div class="stat"><small>ОЧКИ</small><strong id="score">0</strong></div><div class="stat"><small>РЕКОРД</small><strong id="best">0</strong></div><div class="stat"><small>УРОВЕНЬ</small><strong id="level">1</strong></div></section><div class="board" id="board"><canvas id="game" width="600" height="600" aria-label="Игровое поле змейки"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">ГОТОВ ИГРАТЬ?</h2><p id="overlayText">Собирай энергию, расти и не врезайся в стены или себя.</p><button class="btn" id="start">НАЧАТЬ ИГРУ →</button></div></div><div class="actions"><button class="btn secondary" id="pause">⏸ Пауза</button><button class="btn secondary" id="restart">↻ Заново</button><button class="btn secondary" id="sound" aria-pressed="true">♫ Звук</button></div><div class="controls" aria-label="Сенсорное управление"><button class="control up" data-dir="up" aria-label="Вверх">↑</button><button class="control left" data-dir="left" aria-label="Влево">←</button><button class="control down" data-dir="down" aria-label="Вниз">↓</button><button class="control right" data-dir="right" aria-label="Вправо">→</button></div><p class="hint">ПК: стрелки / WASD · Пробел: пауза<br>Телефон: кнопки или свайпы по игровому полю</p><footer>JYLAN.OI © 2026 · PLAY. GROW. SURVIVE.</footer></main><script>
(()=>{'use strict';const N=20,S=600,C=S/N,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),desc=document.getElementById('overlayText'),start=document.getElementById('start'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level');let snake,food,dir,nextDir,score,best=0,state='ready',timer=null,turnLocked=false,sound=true,audio=null;function beep(freq=500,duration=.07){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function buzz(ms=25){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}try{best=Number(localStorage.getItem('jylan-best')||0)||0}catch(e){}bestEl.textContent=best;function reset(){clearTimeout(timer);snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};nextDir=dir;turnLocked=false;score=0;state='ready';scoreEl.textContent='0';levelEl.textContent='1';spawn();draw()}function spawn(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}function speed(){return Math.max(68,155-Math.floor(score/5)*10)}function level(){return 1+Math.floor(score/5)}function panel(t,d,b){title.textContent=t;desc.textContent=d;start.textContent=b;overlay.classList.remove('hidden')}function play(){if(state==='running')return;if(state==='over'||state==='ready')reset();state='running';overlay.classList.add('hidden');clearTimeout(timer);timer=setTimeout(tick,speed())}function pause(){if(state==='running'){state='paused';clearTimeout(timer);panel('ПАУЗА','Отдохни. Змейка подождёт.','ПРОДОЛЖИТЬ →')}else if(state==='paused')play()}function gameOver(won=false){beep(180,.25);buzz(100);state='over';clearTimeout(timer);panel(won?'ПОБЕДА!':'ИГРА ОКОНЧЕНА',`Твои очки: ${score} · Рекорд: ${best}`,'ИГРАТЬ СНОВА →')}function tick(){if(state!=='running')return;dir=nextDir;turnLocked=false;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&head.x===food.x&&head.y===food.y;if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.slice(0,eat?undefined:-1).some(s=>s.x===head.x&&s.y===head.y)){gameOver();draw();return}snake.unshift(head);if(eat){beep(760,.09);buzz(18);score++;scoreEl.textContent=score;levelEl.textContent=level();if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('jylan-best',String(best))}catch(e){}}spawn();if(!food){draw();gameOver(true);return}}else snake.pop();draw();timer=setTimeout(tick,speed())}function rect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.clearRect(0,0,S,S);ctx.fillStyle='#07130f';ctx.fillRect(0,0,S,S);ctx.strokeStyle='#163626';ctx.lineWidth=.65;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,S);ctx.moveTo(0,i*C);ctx.lineTo(S,i*C);ctx.stroke()}if(food){const fx=(food.x+.5)*C,fy=(food.y+.5)*C;ctx.shadowColor='#ff416c';ctx.shadowBlur=23;ctx.fillStyle='#ff466f';ctx.beginPath();ctx.arc(fx,fy,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffc0ce';ctx.beginPath();ctx.arc(fx-3,fy-3,3,0,Math.PI*2);ctx.fill()}snake.forEach((s,i)=>{ctx.shadowColor=i===0?'#8bffb0':'#19ed77';ctx.shadowBlur=i===0?20:11;ctx.fillStyle=i===0?'#a9ffc8':i%2?'#20dc77':'#31f58d';rect(s.x*C+2,s.y*C+2,C-4,C-4,7);ctx.shadowBlur=0});if(snake.length){const h=snake[0],cx=(h.x+.5)*C,cy=(h.y+.5)*C,perp={x:-dir.y,y:dir.x};ctx.fillStyle='#062315';for(const k of [-1,1]){ctx.beginPath();ctx.arc(cx+dir.x*5+perp.x*k*5,cy+dir.y*5+perp.y*k*5,2.6,0,Math.PI*2);ctx.fill()}}}function change(x,y){if(state!=='running'||turnLocked)return;if(x===-dir.x&&y===-dir.y)return;if(x===dir.x&&y===dir.y)return;nextDir={x,y};turnLocked=true}const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};document.addEventListener('keydown',e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;if(dirs[key]){e.preventDefault();change(...dirs[key])}else if(e.code==='Space'){e.preventDefault();pause()}else if(e.key==='Enter'&&state!=='running')play()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};change(...d[b.dataset.dir])}));let touch=null;canvas.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)change(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null},{passive:true});document.getElementById('sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'♫ Звук':'♫ Выкл';e.currentTarget.setAttribute('aria-pressed',String(sound));if(sound)beep(540)});start.addEventListener('click',play);document.getElementById('pause').addEventListener('click',pause);document.getElementById('restart').addEventListener('click',()=>{reset();play()});reset();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
